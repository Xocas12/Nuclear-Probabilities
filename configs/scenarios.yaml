# Scenarios for the probability map (nucprob.probmap). Interceptors are a scenario's, not an attacker's: one
# force is shared among the warheads it faces. Israel and North Korea hold warheads in the
# stockpile table and appear in no scenario: no pairing for them was assumed.
assumptions: {reading: 'Attacker pairs, theatre shares and mid-points are assumptions of this study, not
    findings or sources. Every number either comes from data/curated/stockpiles/ or is named here as stated.',
  theatre_share: 'Stated, no source: the share of an attacker''s available warheads assumed aimed into
    the scenario. [low, mode, high].', inventory_range: 'Low is deployed or loaded forces, high is the
    military stockpile (FAS 2026; OWID citing FAS and NRDC for history). For 1950 the sources conflict, OWID 299
    in the stockpile and NRDC 330 loaded, so the range runs between the two.',
  reliability_modern: '0.8 to 0.9: sgs_hobson_1991 and nrdc_war_plan_2001 for ICBM and SLBM. No source
    was found for bombers, for other land-based missiles or for states other than the US; the same range
    is a stated assumption there.',
  reliability_historical: '0.65, from 0.2 abort, 0.1 operational loss and 0.1 ineffective bombs (frus_1952_54v02p1_d66):
    figures about Soviet bombers attacking the US in 1953, standing in for lack of any source on other
    forces. The +/- 0.07 around it is this study''s assumption, not a source figure.', losses_historical: '0.07 to 0.27: attrition by US defences of Soviet
    bombers, mid-1953 to mid-1955 estimates (frus_1952_54v02p1_d66), the same stand-in. Mode is the mid-point.
    No source was found for US bombers attacking the USSR in 1956.', losses_modern: 'No published fraction
    was found. Instead interceptors: 44 US GMD (csis_gmd) and 68 Russian A-135 (wiki_a135, weak), each
    stopping at most one warhead. One force is shared among all the warheads it faces, in proportion to each
    attacker''s warheads, and 44 GMD are set against an attacker''s whole delivered force, not only that on the US.'}
scenarios:
- id: us_1956_on_bloc
  label: '1956: US stockpile on the Soviet bloc'
  era: historical
  year: 1956
  universe: bloc_1956
  cell_deg: 0.5
  evidence: 'Evidence: mostly the SAC 1956 requirements study, not a war plan, and it trained the score.'
  note: 'US inventory of 1956, bombers only, on the bloc towns of the study outside the sealed set. Reliability (central 0.65, a 1953 US government estimate; the +/- 0.07 around it is this study''s assumption)
    and the share lost to defences (0.07 to 0.27, estimates for mid-1953 to mid-1955) come from Foreign Relations of the
    United States (FRUS) 1952-54 vol. II, doc. 66, on Soviet bombers attacking the US, a stand-in: no source was found
    for US bombers over the USSR.'
  attackers:
  - state: US
    stock_year: 1956
    inventory_low: [strategic_force_loading, nrdc_table_us]
    inventory_high: [military_stockpile, owid_warhead_stockpiles]
    theatre_share: [0.75, 0.9, 1.0]
    reliability: &id001
      all: [0.58, 0.65, 0.72]
    fraction_lost_to_defences: [0.07, 0.17, 0.27]
    targets: &id002 [USSR, China, East Germany, Poland, Czechoslovakia, Hungary, Romania, Bulgaria, Albania,
      North Korea, North Vietnam, Mongolia]
- id: us_1950_stock_on_bloc
  label: 'Counterfactual: the 1950 US stockpile on the 1956 bloc'
  era: historical
  year: 1950
  universe: bloc_1956
  cell_deg: 0.5
  compare_with: us_1956_on_bloc
  evidence: 'A counterfactual, not a document: same towns and score as 1956, smaller stockpile.'
  note: Only the stockpile differs from the 1956 scenario, which supplies its reliability and losses (FRUS 1952-54
    vol. II, doc. 66, US estimates of 1953-55 for Soviet bombers attacking the US).
  attackers:
  - state: US
    stock_year: 1950
    inventory_low: [military_stockpile, owid_warhead_stockpiles]
    inventory_high: [strategic_force_loading, nrdc_table_us]
    theatre_share: [0.75, 0.9, 1.0]
    reliability: *id001
    fraction_lost_to_defences: [0.07, 0.17, 0.27]
    targets: *id002
- id: ussr_1965_on_west
  label: '1965: Soviet stockpile on Western European NATO towns'
  era: historical
  year: 1965
  universe: wp_west_1965
  cell_deg: 0.5
  evidence: 'Evidence: Warsaw Pact exercises and lessons, none a Soviet war plan. The searches recorded
    in data/notes found no declassified Soviet strategic target list.'
  note: 'Soviet inventory of 1965; the share aimed at Western Europe is a stated assumption. Towns carry
    populations of about 1961. Reliability (central 0.65, a 1953 US estimate; the +/- 0.07 around it is this study''s assumption)
    and the share lost to defences (0.07 to 0.27, estimates for mid-1953 to mid-1955) come from FRUS 1952-54 vol. II,
    doc. 66, on Soviet bombers attacking the US, a stand-in for Soviet forces over Western Europe.'
  attackers:
  - state: USSR
    stock_year: 1965
    inventory_low: [strategic_force_loading, nrdc_table_ussr]
    inventory_high: [military_stockpile, owid_warhead_stockpiles]
    theatre_share: [0.25, 0.5, 1.0]
    reliability: *id001
    fraction_lost_to_defences: [0.07, 0.17, 0.27]
    targets: [Denmark, FRG, Netherlands, Belgium, Italy]
