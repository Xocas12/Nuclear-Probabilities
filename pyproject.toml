[project]
name = "nuclear-probabilities"
version = "0.1.0"
description = "What made a place a nuclear target? Places described as of each plan's date, labelled from declassified strike plans (PLAN.md)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    # Processed tables are written as parquet (PLAN section 2).
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    # pop-stat and Demoscope publish their census tables as HTML.
    "lxml>=5.0",
    # Gazetteer matching (PLAN section 8, nucprob/gazetteer).
    "rapidfuzz>=3.6",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    # Dexter-Rodionov's guide is an Excel workbook, KSH's tables old xls; terrain tiles are PNG;
    # the GDR yearbook pages are PDFs with a text layer.
    "openpyxl>=3.1",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "shapely>=2.0",
    "xlrd>=2.0",
]

[project.optional-dependencies]
# The SAC 1956 transcription pipeline (scripts/sac1956_*.py): page rendering, crops.
labels = [
    "pdfplumber>=0.11",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: PLAN section 8 puts nucprob/ at the repository root, not under src/.
packages = ["nucprob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # Cyrillic text is data here, not a typo

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
