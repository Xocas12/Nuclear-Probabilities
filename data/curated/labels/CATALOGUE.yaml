# Data cards for every file in data/curated/labels/ (milestone M4: "each list has a data card
# and provenance tag"). tests/test_catalogue.py checks that every CSV has an entry, that the
# tags are from the vocabularies below, and that the provenance agrees with the file's own
# provenance column. scripts/inventory.py renders the cards into data/INVENTORY.md.
#
# provenance (PLAN section 4.5): plan | study | exercise | defender | reconstruction, or
#   reference for files that are not target lists (code lists, pilots, class counts).
# selection: how the targets were chosen, as far as the source says: judgment | rule | mixed |
#   unknown | n/a.
# use: training (enough rows to fit a model: PLAN 5.3) | transfer-test (a small list, used to
#   check whether a model transfers: PLAN 5.2) | validation (totals or counts to check
#   against) | audit (kept for checking, not as labels) | reference (codes, pilots) .
# card: where the full source card is (path, section).

lists:
  - file: us_1956_sac_complexes.csv
    title: SAC Atomic Weapons Requirements Study for 1959, Part I complex list
    planner: US (Strategic Air Command)
    targets: Soviet bloc, China, North Korea, North Vietnam, Mongolia
    year: 1956
    provenance: study
    selection: judgment
    use: training
    completeness: complete transcription of the released list; one printed page lost from the scan
    card: data/curated/sac1956/README.md
    caveats: weapons columns redacted; DGZ letters and installation names not explained

  - file: us_1956_sac_airfields.csv
    title: SAC Atomic Weapons Requirements Study for 1959, Part II airfield list
    planner: US (Strategic Air Command)
    targets: Soviet bloc, China, North Korea
    year: 1956
    provenance: study
    selection: judgment
    use: training
    completeness: complete; 3 misreads corrected by the cross-document check
    card: data/curated/sac1956/README.md
    caveats: the Part II printing has typing slips of its own (cross-document check)

  - file: us_1956_sac_part2_complexes.csv
    title: SAC 1956 study, Part II complex list with weapons (excerpt)
    planner: US (Strategic Air Command)
    targets: USSR, East Germany, Poland, Czechoslovakia, Hungary, China, Mongolia, Romania
    year: 1956
    provenance: study
    selection: judgment
    use: validation
    completeness: 43 complexes in the published excerpt; elsewhere unknown
    card: data/curated/sac1956/README.md (The excerpts)
    caveats: the stockpile-limited allocation; selected = keeps an aim point

