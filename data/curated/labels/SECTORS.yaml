    include:
      - {country: Netherlands, lat_min: 52.70, lat_max: 53.72, lon_min: 5.06, lon_max: 7.32}
  - plan_id: us_1958_taiwan_strait
    basis: derived
    include:
      - {country: China, lat_min: 23.98, lat_max: 24.98, lon_min: 117.33, lon_max: 118.83}
    notes: One linked positive, Xiamen, so the list is too small to score and the box holds 3 towns.
# Lists read over their whole universe, each with the reason. tests/test_label_rules.py fails if a list
# with role train and a linked positive is in neither part of this file.
whole_universe:
  us_1956_sac_complexes: The study covers the whole Soviet bloc and its town list claims completeness.
  us_1945_target_committee: A list of cities considered across Japan; its candidates are the whole country's.
  us_1963_jcs_china_vulnerability: A table for China as a whole. It has no linked unsealed designated town.
  us_1964_china_nuclear: A study of China as a whole. It has no linked unsealed designated town.
