# Evidence registry: what each target list is, kept apart from what it says. CATALOGUE.yaml holds
# the card of each file; this file holds the fields models and reports must not blur.
# tests/test_plans.py checks it against CATALOGUE.yaml and against the rules below.
#
# attacker: the state whose weapons the document assigns. Blank when no state's real intent is
#   recorded: civil-defence lists and mirrors say what a defender expected, not what an attacker
#   planned. "Warsaw Pact" = fired by the Unified Command, with no one national owner.
# author: who wrote the document. For a mirror this is not the side it simulates.
# date: the document's date, as precisely as its card allows.
# doc_type:
#   war_plan           approved operational plan of an armed force
#   disputed_plan_or_exercise  sources disagree whether it is a plan or an exercise; not counted
#                      as a plan, never called a war plan (data/notes/soviet_search_2026-11.md)
#   target_selection   decisions on what to strike with weapons about to be used
#   requirements_study staff study of weapons requirements against a target list
#   policy_study       staff or policy study that names targets; no approval to strike
#   exercise           command-staff exercise; targets are written for the exercise scenario
#   wargame            two-sided war game
#   training           staff-college lesson
#   mirror             one side's exercise simulating the other side's strikes on itself
#   civil_defence      a government's assumption of where its own country would be hit
#   reconstruction     journalists or Wikipedia, attributing targets to a plan they do not quote
# grade: A a primary document (or its published translation) read here;
#   B a primary document read here, naming only part of the targets it counts, or a later
#     classified history quoting the primary;
#   C a scholar's table or paraphrase of an archive file not read here;
#   D journalism, or an encyclopedia;
#   U a text of unrecorded origin, not checked against any document held here. Never scored.
# group: lists sharing a group come from one document or exercise, and count as one plan when
#   plans are counted (configs/protocol.yaml).
# complete: true if the list claims to give all targets within its scope. false = positive-
#   unlabeled: a town not on the list may still have been a target.
# role: train (may enter a classifier as attacker evidence) | test-expectation (scored only, as
#   evidence of another kind) | excluded (no labels taken).
