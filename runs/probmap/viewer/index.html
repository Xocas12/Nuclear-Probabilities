document.getElementById("method").textContent=`The score here is the ${D.score}: each delivered warhead falls on a town with chance in proportion to a score that moves only a few times over the range of population, so a cell's probability depends on how many towns it holds as well as on its people (the spread for the scenario shown is under the map). What a town produced, housed or defended plays no part. The score is fitted on all attacker documents together, exercises included, and is no single state's model: "Historical" in the scenario list means the stockpile and a target list are of that year, not that the score is that attacker's.\nThese are consequences of stated assumptions, not forecasts. Theatre shares have no source.\nOn the 1956 towns the map uses only the part of delivered warheads falling on towns outside the sealed set, shown in the table. The 1965 map has no United Kingdom: its only census table was withdrawn because the path it came through is disallowed by the site's robots.txt, so the stated share falls on the five continental countries.\nThe interval runs from the 5th to the 95th percentile of draws of the model and the stockpile; it holds the allocation rule, who fires on whom and the list of towns fixed, so it is narrower than what is unknown. See REPORT.md: no score has been shown to beat population on a document it has not seen.`;

g.fillStyle=css("--land");for(const ring of D.land){g.beginPath();ring.forEach((p,i)=>i?g.lineTo(X(v,p[0]),Y(v,p[1])):g.moveTo(X(v,p[0]),Y(v,p[1])));g.closePath();g.fill()}
for(const q of s.cells){g.fillStyle=col(q[b]);const w=s.deg*v.k*v.sc,h=s.deg*v.sc;g.fillRect(X(v,q[1])+.5,Y(v,q[0]+s.deg)+.5,w-1,h-1);if(q[5]){g.strokeStyle=css("--ink");g.lineWidth=1;g.strokeRect(X(v,q[1])+1,Y(v,q[0]+s.deg)+1,w-2,h-2)}}
document.getElementById("banner").textContent=(s.era=="modern"?"EXTRAPOLATION. A score from Cold War lists applied to present-day towns from a map-label set. A classifier tells them from the training towns at ROC-AUC "+D.shift[0].value+" on ten features, where 0.5 is no shift. Not a statement about any present plan. ":s.shift_label.toUpperCase()+". ")+s.evidence;
document.getElementById("info").textContent=`${s.note} ${s.towns} towns on a ${s.deg}-degree grid. Across them population runs over a ${s.population_ratio}-fold range and the median score over a ${s.score_ratio}-fold range.`+(s.cells.some(q=>q[5])?" Outlined cells hold a town of the sealed set: towns in 300 km blocks kept out of every model fit for a final test (REPORT.md, Method), so they get no score here; a cell with only sealed towns is absent.":"");
document.getElementById("del").innerHTML="<tr><th>Attacker</th><th>5th</th><th>median</th><th>95th</th><th>median on scored towns</th></tr>"+s.delivered.map(d=>`<tr><td>${d.attacker}</td><td>${d.delivered_low}</td><td>${d.delivered_median}</td><td>${d.delivered_high}</td><td>${d.on_scored_towns_median}</td></tr>`).join("");
document.getElementById("tab").innerHTML="<tr><th>Cell (S, W corner)</th><th>median</th><th>5th</th><th>95th</th></tr>"+s.cells.map(q=>`<tr><td>${q[0]}, ${q[1]}</td><td>${q[2]}</td><td>${q[3]}</td><td>${q[4]}</td></tr>`).join("")}
map.addEventListener("mousemove",e=>{const s=D.scenarios[sel.value],v=view,b=map.getBoundingClientRect(),f=map.width/b.width,x=(e.clientX-b.left)*f,y=(e.clientY-b.top)*f,lon=x/(v.k*v.sc)+v.c,lat=(map.height-y)/v.sc+v.a;
const q=s.cells.find(c=>lat>=c[0]&&lat<c[0]+s.deg&&lon>=c[1]&&lon<c[1]+s.deg);if(!q){tip.style.display="none";return}
tip.textContent=`P about ${q[2]} (${q[3]} to ${q[4]})`+(q[5]?" (cell holds a sealed town)":"");tip.style.display="block";tip.style.left=e.clientX+14+"px";tip.style.top=e.clientY+14+"px"});
map.addEventListener("mouseleave",()=>tip.style.display="none");sel.onchange=draw;band.onchange=draw;draw();
</script></body></html>
